name: Build SHIKSHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Files
        run: |
          # Finds and extracts any ZIP
          find . -name "*.zip" -exec unzip -q {} \;
          find . -name "*.zip" -delete
          
          # Removes heavy node_modules to stop freezing
          rm -rf node_modules
          find . -name "node_modules" -type d -exec rm -rf {} +
          
          # Moves files from subfolders to root
          PKG_PATH=$(find . -maxdepth 4 -name package.json | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            DIR=$(dirname "$PKG_PATH")
            if [ "$DIR" != "." ]; then
              cp -r "$DIR"/* .
              cp -r "$DIR"/.* . 2>/dev/null || true
            fi
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build Web
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup App
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "SHIKSHA" "com.shiksha.app" --web-dir=dist
          npx cap add android
          sed -i 's/<\/application>/ <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="false" \/>\n <\/application>/' android/app/src/main/AndroidManifest.xml
          
          if [ -f "icon.png" ]; then
            npx capacitor-assets generate --icon icon.png --android
          fi
          
          npx cap sync android

      - name: Fix Kotlin
        run: |
          cd android/app
          echo 'configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"; force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22" } }' >> build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2560m"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SHIKSHA
          path: android/app/build/outputs/apk/debug/app-debug.apk
