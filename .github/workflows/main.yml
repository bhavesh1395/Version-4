name: Build SHIKSHA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Fast Checkout
      uses: actions/checkout@v4

    - name: ⚡ Step 1: Fix Files & Clean Up
      run: |
        # 1. Unzip ZIPs if found
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
             echo "Unzipping $ZIP_FILE..."
             unzip -q "$ZIP_FILE"
             rm "$ZIP_FILE"
        fi

        # 2. DELETE node_modules (Prevents freezing)
        find . -name "node_modules" -type d -prune -exec rm -rf '{}' +

        # 3. Move files to root if hidden
        PKG_PATH=$(find . -maxdepth 4 -name package.json | head -n 1)
        if [ -n "$PKG_PATH" ]; then
             PROJECT_DIR=$(dirname "$PKG_PATH")
             if [ "$PROJECT_DIR" != "." ]; then
                  echo "Moving files to root..."
                  cp -r "$PROJECT_DIR"/* .
                  cp -r "$PROJECT_DIR"/.* . 2>/dev/null || true
             fi
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Step 2: Install Dependencies
      run: npm install --no-audit --no-fund

    - name: Step 3: Build Web App
      run: npm run build
      env:
        NODE_ENV: production

    - name: Step 4: Setup SHIKSHA
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
        
        # Initialize with Name "SHIKSHA" (Exactly as requested)
        npx cap init "SHIKSHA" "com.shiksha.app" --web-dir=dist
        npx cap add android
        
        # Optimization: Hardware Acceleration
        sed -i 's/<\/application>/    <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="false" \/>\n    <\/application>/' android/app/src/main/AndroidManifest.xml
        
        # Icon Generation
        if [ -f "icon.png" ]; then
            echo "✅ icon.png found! Generating icons..."
            npx capacitor-assets generate --icon icon.png --android
        fi

        npx cap sync android

    - name: 🚑 Step 5: Fix Kotlin Conflict
      run: |
        cd android/app
        echo '
        configurations.all {
            resolutionStrategy {
                force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
            }
        }
        ' >> build.gradle

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Step 6: Build APK
      run: |
        chmod +x android/gradlew
        cd android
        # Build command (No Daemon)
        ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2560m"

    - name: Upload SHIKSHA
      uses: actions/upload-artifact@v4
      with:
        name: SHIKSHA
        path: android/app/build/outputs/apk/debug/app-debug.apk
