name: Build SHIKSHA
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fix Files
        run: |
          find . -name "*.zip" -exec unzip -q {} \;
          find . -name "*.zip" -delete
          rm -rf node_modules
          PKG=$(find . -name package.json | head -n 1)
          if [ -n "$PKG" ]; then
            DIR=$(dirname "$PKG")
            if [ "$DIR" != "." ]; then
              cp -r "$DIR"/* .
              cp -r "$DIR"/.* . 2>/dev/null || true
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund
      
      - run: npm run build
        env:
          NODE_ENV: production

      - name: Setup App (Safe Mode)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "SHIKSHA" "com.shiksha.app" --web-dir=dist
          npx cap add android
          
          # Anti-Lag Fix
          sed -i 's/<\/application>/ <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="false" \/>\n <\/application>/' android/app/src/main/AndroidManifest.xml
          
          # FIXED: Move icon to correct folder and run safely
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/logo.png
            cp icon.png assets/icon.png
            # The "|| true" below ensures the build NEVER crashes here
            npx capacitor-assets generate --android || true
          fi
          
          npx cap sync android

      - name: Fix Kotlin
        run: |
          cd android/app
          echo 'configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"; force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22" } }' >> build.gradle

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2560m"

      - uses: actions/upload-artifact@v4
        with:
          name: SHIKSHA
          path: android/app/build/outputs/apk/debug/app-debug.apk
